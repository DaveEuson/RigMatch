[package]
name = "rigmatch-chat"
version = "0.9.0"
description = "RigMatch Chat — local AI model matchmaking companion"
authors = ["RigMatch"]
# Not open source. There is no LICENSE under rigmatch-chat/, so the repository
# root LICENSE governs this crate too: the source is published to be read and
# audited, not reused. LicenseRef-* is the SPDX form for a custom licence, so
# scanners and `cargo metadata` cannot mistake it for a permissive one — which
# is what "MIT" here did, in the only machine-readable licence field in the repo.
license = "LicenseRef-RigMatch-Source-Available"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rigmatch_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
sysinfo = "0.33"
# Already in the tree via Tauri. Declared directly so a generation can be woken
# and dropped the moment Stop is pressed, rather than only between chunks — a
# model still loading into VRAM produces no chunks to check against.
tokio = { version = "1", features = ["sync", "macros", "rt"] }

# The shipped binary trades build time for size. One codegen unit and full LTO
# let the linker drop code across crate boundaries, "s" optimizes for size, and
# strip removes the symbol table. Unwinding stays: panic = "abort" would change
# what a panic in a stream handler does, not just how big the binary is.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
