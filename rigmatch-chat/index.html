<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Caroline — Companion</title>
    <!-- Apply dark mode before first paint to prevent flash -->
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.body.style.cssText = 'background:#1a0000;color:#ff6060;font-family:monospace;padding:2rem;margin:0;';
        document.body.innerHTML = '<h2>Startup error</h2><pre>' + msg + '\n\n' + (err && err.stack || '') + '</pre>';
        return true;
      };
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e0c14;color:#b8b2cc;font-family:sans-serif;gap:12px;">
        <span style="font-size:28px">⚡</span>
        <span>Loading RigMatch Chat...</span>
        <span id="js-error" style="color:#ff6060;font-size:11px;max-width:500px;text-align:center;margin-top:8px;font-family:monospace;white-space:pre-wrap"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
