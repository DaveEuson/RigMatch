name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: win
            companion: rigmatch-chat.exe
          - os: macos-latest
            platform: mac
            artifact: mac
            companion: rigmatch-chat
          - os: ubuntu-latest
            platform: linux
            artifact: linux
            companion: rigmatch-chat

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rigmatch-chat/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install main app dependencies
        run: npm ci

      - name: Install RigMatch Chat dependencies
        run: npm ci
        working-directory: rigmatch-chat

      - name: Build RigMatch Chat companion
        run: npx tauri build
        working-directory: rigmatch-chat
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Copy companion binary (button launch fallback)
        shell: bash
        run: |
          mkdir -p companions
          cp rigmatch-chat/src-tauri/target/release/${{ matrix.companion }} companions/

      - name: Collect Chat standalone installer
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp rigmatch-chat/src-tauri/target/release/bundle/nsis/*-setup.exe release/ 2>/dev/null || true
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cp rigmatch-chat/src-tauri/target/release/bundle/appimage/*.AppImage release/ 2>/dev/null || true
          fi
          # Mac: handled by afterPack hook — Chat.app is bundled into the DMG

      - name: Build RigMatch.AI
        run: npm run build && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.zip
            release/**/latest*.yml
