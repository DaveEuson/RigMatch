name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: win
            companion: rigmatch-chat.exe
            builderArgs: --win
            chatBuilderArgs: ''
          - os: macos-latest
            platform: mac
            artifact: mac-arm64
            companion: rigmatch-chat
            builderArgs: --mac --arm64
            chatBuilderArgs: --bundles app
          - os: macos-15-intel
            platform: mac
            artifact: mac-x64
            companion: rigmatch-chat
            builderArgs: --mac --x64
            chatBuilderArgs: --bundles app
          - os: ubuntu-latest
            platform: linux
            artifact: linux-x64
            companion: rigmatch-chat
            builderArgs: --linux --x64
            chatBuilderArgs: --bundles deb
          - os: ubuntu-24.04-arm
            platform: linux
            artifact: linux-arm64
            companion: rigmatch-chat
            builderArgs: --linux --arm64
            chatBuilderArgs: --bundles deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 24: the scoring unit tests import a .ts module directly and rely on
          # built-in TypeScript type-stripping (default in Node >= 23.6 / 24).
          node-version: '24'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rigmatch-chat/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # Fail in seconds rather than after five ~20-minute builds if the tag has no
      # entry in src/data/releaseNotes.ts. No dependencies needed — plain Node.
      - name: Check release notes exist for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/build-release-notes.mjs --check --version "${GITHUB_REF_NAME}"

      - name: Audit npm dependencies
        run: npm audit --audit-level=critical

      - name: Install main app dependencies
        run: npm ci

      - name: Install RigMatch Chat dependencies
        run: npm ci
        working-directory: rigmatch-chat

      - name: Run security regression tests
        run: npm test

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet 2>/dev/null || true
          # RUSTSEC-2026-0194/0195: XML-parse DoS advisories in quick-xml 0.39.x,
          # reached only transitively via plist 1.9.0 -> tauri-utils (Apple
          # property-list parsing in Tauri's bundler/config tooling — not runtime
          # untrusted input). No upstream fix: plist 1.9.0 is latest and pins
          # quick-xml ^0.39.2. Remove once plist/tauri ship a quick-xml >=0.41 chain.
          cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
        working-directory: rigmatch-chat/src-tauri

      - name: Build RigMatch Chat companion
        run: npm exec -- tauri build ${{ matrix.chatBuilderArgs }}
        working-directory: rigmatch-chat
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Copy companion binary (button launch fallback)
        shell: bash
        run: |
          mkdir -p companions
          cp rigmatch-chat/src-tauri/target/release/${{ matrix.companion }} companions/

      - name: Collect Chat standalone installer
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp rigmatch-chat/src-tauri/target/release/bundle/nsis/*-setup.exe release/ 2>/dev/null || true
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp rigmatch-chat/src-tauri/target/release/bundle/appimage/*.AppImage release/ 2>/dev/null || true
            cp rigmatch-chat/src-tauri/target/release/bundle/deb/*.deb release/ 2>/dev/null || true
          fi
          # Mac: handled by afterPack hook — Chat.app is bundled into the DMG

      # The Linux-only advisory guard, which the release path used to route
      # around entirely. It is wired into `npm run dist:linux` and `pack:linux`,
      # and this job calls electron-builder directly — so v0.6.0 shipped Linux
      # artifacts without the check that exists to stop exactly that. Run it
      # here, where the Linux artifacts are actually made.
      - name: Check Linux advisories
        if: matrix.platform == 'linux'
        run: node scripts/check-linux-advisories.mjs

      - name: Build RigMatch
        run: npm run build && npm exec -- electron-builder ${{ matrix.builderArgs }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Linux needs no renaming: electron-builder already emits latest-linux.yml
      # (x64) and latest-linux-arm64.yml, which is exactly what electron-updater
      # asks for — Provider.getChannelFilePrefix() builds "-linux" plus "" for
      # x64 or "-arm64" otherwise. An earlier rename step added a second arch
      # suffix (latest-linux-linux-x64.yml), so every Linux update check 404'd
      # with ERR_UPDATER_CHANNEL_FILE_NOT_FOUND.
      #
      # Mac is the real collision: both Mac runners emit latest-mac.yml and one
      # overwrites the other when artifacts merge, leaving an arm64-only
      # manifest that Intel Macs cannot update from. Stage them under
      # arch-unique names; the release job merges them back into one
      # latest-mac.yml listing both arches (MacUpdater filters by arch itself,
      # so a single file is required — not one per arch).
      - name: Stage Mac update metadata for merging
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [[ -f release/latest-mac.yml ]]; then
            mv release/latest-mac.yml "release/latest-mac-${{ matrix.artifact }}.yml"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: release/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      # Checkout first: it cleans untracked files, which would wipe release/.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 24: build-release-notes.mjs imports src/data/releaseNotes.ts
          # directly and relies on built-in type-stripping (Node >= 23.6 / 24).
          node-version: '24'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release/

      # Fails the release if either Mac manifest is missing, rather than
      # publishing one that silently breaks auto-update for an architecture.
      - name: Merge Mac update metadata
        run: node scripts/merge-mac-manifest.mjs release

      - name: Generate SHA-256 checksums
        run: |
          cd release
          find . -maxdepth 2 -type f \( -name "RigMatch-*.exe" -o -name "RigMatch-*.dmg" -o -name "RigMatch-*.AppImage" -o -name "RigMatch-*.deb" -o -name "RigMatch-*.zip" \) -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Body = the tag's entry from src/data/releaseNotes.ts (same text the in-app
      # Update Center shows) followed by the download and macOS-first-launch
      # sections. Validated early in the build job, so this cannot fail here.
      - name: Write release notes
        id: notes
        shell: bash
        run: |
          node scripts/build-release-notes.mjs --version "${GITHUB_REF_NAME}"
          TITLE="$(node scripts/build-release-notes.mjs --print-title --version "${GITHUB_REF_NAME}")"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Release title: ${TITLE}"

      - name: Classify release tag
        id: release_meta
        shell: bash
        run: |
          # -beta is the stable/Latest channel; only nightly/alpha/canary/preview are pre-releases.
          if [[ "${GITHUB_REF_NAME}" =~ (nightly|alpha|canary|preview) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.notes.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            release/RigMatch-*.exe
            release/RigMatch-*.dmg
            release/RigMatch-*.AppImage
            release/RigMatch-*.deb
            release/RigMatch-*.zip
            release/latest*.yml
            release/SHA256SUMS.txt
