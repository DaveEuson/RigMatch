name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: win
            companion: rigmatch-chat.exe
            builderArgs: --win
          - os: macos-latest
            platform: mac
            artifact: mac
            companion: rigmatch-chat
            builderArgs: --mac
          - os: ubuntu-latest
            platform: linux
            artifact: linux-x64
            companion: rigmatch-chat
            builderArgs: --linux --x64
          - os: ubuntu-24.04-arm
            platform: linux
            artifact: linux-arm64
            companion: rigmatch-chat
            builderArgs: --linux --arm64

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rigmatch-chat/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Audit npm dependencies
        run: npm audit --audit-level=critical

      - name: Install main app dependencies
        run: npm ci

      - name: Install RigMatch Chat dependencies
        run: npm ci
        working-directory: rigmatch-chat

      - name: Run security regression tests
        run: npm test

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet 2>/dev/null || true
          cargo audit
        working-directory: rigmatch-chat/src-tauri

      - name: Build RigMatch Chat companion
        run: npm exec -- tauri build
        working-directory: rigmatch-chat
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Copy companion binary (button launch fallback)
        shell: bash
        run: |
          mkdir -p companions
          cp rigmatch-chat/src-tauri/target/release/${{ matrix.companion }} companions/

      - name: Collect Chat standalone installer
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp rigmatch-chat/src-tauri/target/release/bundle/nsis/*-setup.exe release/ 2>/dev/null || true
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp rigmatch-chat/src-tauri/target/release/bundle/appimage/*.AppImage release/ 2>/dev/null || true
            cp rigmatch-chat/src-tauri/target/release/bundle/deb/*.deb release/ 2>/dev/null || true
          fi
          # Mac: handled by afterPack hook — Chat.app is bundled into the DMG

      - name: Build RigMatch.AI
        run: npm run build && npm exec -- electron-builder ${{ matrix.builderArgs }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Make Linux metadata architecture-specific
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          for file in release/latest*.yml; do
            mv "$file" "${file%.yml}-${{ matrix.artifact }}.yml"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.artifact }}
          path: release/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release/

      - name: Generate SHA-256 checksums
        run: |
          cd release
          find . -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.zip
            release/**/latest*.yml
            release/SHA256SUMS.txt
