name: Post-release install smoke

on:
  # Fires itself when a release is published — including pre-releases, which are
  # exactly the ones worth smoke-testing before promoting them. It stayed
  # dispatch-only through 0.6.0 and therefore never ran for it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (or leave empty and give a run)
        required: false
        default: ''
      run_id:
        description: Build & Release run to verify before tagging (its artifacts)
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  RUN_ID: ${{ inputs.run_id }}

jobs:
  linux:
    name: Linux install smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu and the newest: a package can install
          # cleanly on both and still fail to load on the older one.
          - os: ubuntu-22.04
            label: x64, 22.04
            artifact: linux-x64
            appimage_suffix: linux-x86_64.AppImage
            deb_suffix: linux-amd64.deb
          - os: ubuntu-latest
            label: x64, latest
            artifact: linux-x64
            appimage_suffix: linux-x86_64.AppImage
            deb_suffix: linux-amd64.deb
          - os: ubuntu-22.04-arm
            label: arm64, 22.04
            artifact: linux-arm64
            appimage_suffix: linux-arm64.AppImage
            deb_suffix: linux-arm64.deb
          - os: ubuntu-24.04-arm
            label: arm64, 24.04
            artifact: linux-arm64
            appimage_suffix: linux-arm64.AppImage
            deb_suffix: linux-arm64.deb

    steps:
      - name: Download Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          APPIMAGE_SUFFIX: ${{ matrix.appimage_suffix }}
          DEB_SUFFIX: ${{ matrix.deb_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-$ARTIFACT" --dir assets
          else
            test -n "$TAG" || { echo "::error::Give a tag or a run"; exit 1; }
            version="${TAG#v}"
            version="${version%%-*}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "RigMatch-$version-$APPIMAGE_SUFFIX" --pattern "RigMatch-$version-$DEB_SUFFIX" --dir assets
          fi
          appimage="$(ls assets/RigMatch-*-"$APPIMAGE_SUFFIX")"
          deb="$(ls assets/RigMatch-*-"$DEB_SUFFIX")"
          test -s "$appimage"
          test -s "$deb"
          sha256sum "$appimage" "$deb"
          chmod +x "$appimage"
          echo "APPIMAGE=$PWD/$appimage" >> "$GITHUB_ENV"
          echo "DEB=$PWD/$deb" >> "$GITHUB_ENV"

      - name: Verify AppImage can be extracted
        shell: bash
        run: |
          set -euo pipefail
          "$APPIMAGE" --appimage-extract >/tmp/rigmatch-appimage-extract.log 2>&1
          test -x squashfs-root/AppRun
          test -s squashfs-root/usr/share/metainfo/ai.rigmatch.app.metainfo.xml
          find squashfs-root -maxdepth 2 -type f \( -name "*.desktop" -o -name "RigMatch" -o -name "rigmatch-ai" \) -print

      # Extracting works without FUSE, so the step above could not tell that
      # through 0.9.1 the AppImage did not open on a stock Ubuntu: its runtime
      # loads libfuse2 to mount itself, and 22.04 and newer install fuse3 in
      # its place. Take libfuse2 away and mount it the way a double-click does.
      - name: Open the AppImage without libfuse2
        shell: bash
        run: |
          set -euo pipefail
          for pkg in libfuse2 libfuse2t64; do
            if dpkg -s "$pkg" >/dev/null 2>&1; then sudo apt-get remove -y "$pkg"; fi
          done
          if ldconfig -p | grep -q 'libfuse\.so\.2'; then echo "::error::libfuse2 is still installed"; exit 1; fi
          command -v fusermount3 >/dev/null || sudo apt-get install -y fuse3
          "$APPIMAGE" --appimage-mount >/tmp/rigmatch-appimage-mount.log 2>&1 &
          pid=$!
          mnt=""
          for _ in $(seq 1 30); do
            mnt="$(head -n 1 /tmp/rigmatch-appimage-mount.log || true)"
            if [[ -x "$mnt/AppRun" ]] || ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/rigmatch-appimage-mount.log
          test -x "$mnt/AppRun"
          test -s "$mnt/usr/share/metainfo/ai.rigmatch.app.metainfo.xml"
          kill "$pid"

      - name: Install Debian package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "$DEB"
          dpkg -s rigmatch-ai
          dpkg -L rigmatch-ai | sed -n '1,80p'
          test -e /usr/bin/rigmatch-ai

      # Installing proves the files arrived; it says nothing about whether this
      # system's C library can load them. A binary built against a newer glibc
      # installs cleanly and then fails the moment it starts.
      - name: Check the installed binaries load on this system
        shell: bash
        run: |
          set -euo pipefail
          app="$(dirname "$(readlink -f /usr/bin/rigmatch-ai)")"
          missing=0
          for bin in "$app/rigmatch-ai" "$app/companions/rigmatch-chat"; do
            test -x "$bin"
            echo "== $bin"
            # Captured first: with pipefail, grep -q quitting early could hide a match.
            out="$(ldd "$bin" 2>&1 || true)"
            echo "$out"
            if grep -q "not found" <<<"$out"; then missing=1; fi
          done
          test "$missing" = 0

  macos:
    name: macOS DMG smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple Silicon
            artifact: mac-arm64
            dmg_suffix: mac-arm64.dmg
          - os: macos-15-intel
            label: Intel
            artifact: mac-x64
            dmg_suffix: mac-x64.dmg

    steps:
      - name: Download the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          DMG_SUFFIX: ${{ matrix.dmg_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-$ARTIFACT" --dir assets
          else
            test -n "$TAG" || { echo "::error::Give a tag or a run"; exit 1; }
            version="${TAG#v}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "RigMatch-${version%%-*}-$DMG_SUFFIX" --dir assets
          fi
          dmg="$(ls assets/RigMatch-*-"$DMG_SUFFIX")"
          test -s "$dmg"
          shasum -a 256 "$dmg"
          version="$(basename "$dmg")"
          version="${version#RigMatch-}"
          echo "DMG=$PWD/$dmg" >> "$GITHUB_ENV"
          echo "VERSION=${version%-"$DMG_SUFFIX"}" >> "$GITHUB_ENV"

      - name: Mount DMG and inspect apps
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/rigmatch-dmg"
          install_dir="$RUNNER_TEMP/RigMatchInstallSmoke"

          mkdir -p "$mountpoint" "$install_dir"
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" -quiet || true' EXIT

          find "$mountpoint" -maxdepth 2 -name "*.app" -print
          test -d "$mountpoint/RigMatch.app"
          test -d "$mountpoint/RigMatch Chat.app"
          # Before 0.9.0 this was a second copy of RigMatch, and every check
          # below passed it: it has an executable. Check which app it is.
          test "$(plutil -extract CFBundleIdentifier raw -o - "$mountpoint/RigMatch Chat.app/Contents/Info.plist")" = "ai.rigmatch.chat"

          app_version="$(plutil -extract CFBundleShortVersionString raw -o - "$mountpoint/RigMatch.app/Contents/Info.plist")"
          test "$app_version" = "$VERSION"
          test -x "$mountpoint/RigMatch.app/Contents/MacOS/RigMatch"

          ditto "$mountpoint/RigMatch.app" "$install_dir/RigMatch.app"
          ditto "$mountpoint/RigMatch Chat.app" "$install_dir/RigMatch Chat.app"
          xattr -cr "$install_dir/RigMatch.app" "$install_dir/RigMatch Chat.app"

          test -x "$install_dir/RigMatch.app/Contents/MacOS/RigMatch"
          find "$install_dir/RigMatch Chat.app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit | grep .
