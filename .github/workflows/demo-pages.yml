name: Publish Demo Page

# Deploys the RigMatch web presence to GitHub Pages:
#   /RigMatch/       → marketing landing page (site/index.html)
#   /RigMatch/app/   → the full app in preview mode (interactive demo)
# In a browser there is no Electron bridge (window.agentArcade), so the app runs
# in preview mode automatically — the whole game-show UI with sample data, no
# local Ollama required.

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - site/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web demo
        # Desktop build uses base './' (vite.config.ts). For Pages the app lives at
        # /RigMatch/app/, so build it there; the hand-authored landing page then
        # sits at the site root (/RigMatch/).
        run: |
          npx tsc -b
          npx vite build --base=/RigMatch/app/ --outDir dist/app --emptyOutDir
          cp -r site/. dist/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
